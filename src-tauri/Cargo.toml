[package]
name = "qa-receiver-center"
version = "0.1.0"
description = "Desktop QA tool for receiver operations, diagnostics, firmware updates, and reports."
authors = ["QA Team"]
license = ""
repository = "https://det-ados/tfs/Terrasat/QA/_git/rx-center"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
reqwest = { version = "0.12", features = ["blocking"] }
roxmltree = "0.21"
regex = "1.12"
