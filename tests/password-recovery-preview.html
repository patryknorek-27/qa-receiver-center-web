<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="connect-src 'self' ws://127.0.0.1:5174;" />
    <title>Password recovery test preview (mock receivers only)</title>
  </head>
  <body>
    <div id="root"></div>
    <aside id="test-controls" hidden style="position:fixed;bottom:8px;left:8px;z-index:12000;padding:8px;background:#fff;color:#111;border:1px solid #555;font:12px sans-serif">
      <button id="simulate" type="button">Simulate two failures</button>
      <button id="next-incident" type="button">New incident for same receiver</button>
      <button id="resolve" type="button">Resolve warnings</button>
      Sound requests: <output id="sound-count">0</output>
      Blocked operations: <output id="blocked-count">0</output>
    </aside>
    <script type="module">
      import { mockIPC, mockWindows } from '@tauri-apps/api/mocks'
      // Test-only entry point. Every native call is intercepted; no receiver is contacted.
      window.isTauri = true
      mockWindows('main')
      const scenario = new URLSearchParams(location.search).get('scenario') || 'failed'
      const makeNotice = (index, jobId = 'test-only') => ({
        ip: `192.0.2.${10 + index}`, jobId, receiverName: `Lab receiver ${index + 1}`, model: 'BD940-INS',
        message: 'Receiver acknowledged the password change, but the single login attempt could not be confirmed. Check this receiver before using other scripts.',
      })
      let notices = scenario === 'resolved' || scenario === 'interactive' ? []
        : Array.from({ length: scenario === 'many' ? 20 : scenario === 'multiple' ? 3 : 1 }, (_, index) => makeNotice(index))
      let soundRequests = 0
      let blockedOperations = 0
      let nextJob = 0
      const controls = document.getElementById('test-controls')
      controls.hidden = scenario !== 'interactive'
      document.getElementById('simulate').onclick = () => {
        notices = [makeNotice(0)]
        setTimeout(() => { notices = [...notices, makeNotice(1)] }, 5000)
      }
      document.getElementById('next-incident').onclick = () => {
        notices = [makeNotice(0, `next-job-${++nextJob}`)]
      }
      document.getElementById('resolve').onclick = () => { notices = [] }
      mockIPC((command, args) => {
        switch (command) {
          case 'authenticate_operator': return null
          case 'scan_receivers':
          case 'load_receivers_config':
          case 'get_single_firmware_update_history': return []
          case 'get_firmware_update_config': return { mode: args.mode, receivers: [] }
          case 'list_firmware_releases': return { releases: [], refreshedAt: '', baseUrl: '' }
          case 'get_password_recovery_notices':
            if (scenario === 'error') throw new Error('Simulated record read failure')
            return notices
          case 'play_password_recovery_sound':
            document.getElementById('sound-count').textContent = String(++soundRequests)
            if (scenario === 'sound-error') throw new Error('Simulated audio failure')
            return true
          default:
            document.getElementById('blocked-count').textContent = String(++blockedOperations)
            throw new Error(`Native operation blocked by test preview: ${command}`)
        }
      }, { shouldMockEvents: true })
      await import('/src/main.tsx')
    </script>
  </body>
</html>
