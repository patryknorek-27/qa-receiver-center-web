<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/qa_center_icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QA Receiver Center</title>
    <style>
      html,
      body {
        background: #000;
      }

      #startup-splash {
        position: fixed;
        inset: 0;
        z-index: 100000;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #000;
        opacity: 1;
        transition: opacity 220ms ease;
      }

      #startup-splash.is-hidden {
        pointer-events: none;
        opacity: 0;
      }

      #startup-splash video {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div id="startup-splash" role="status" aria-label="QA Receiver Center is loading">
      <video autoplay muted playsinline preload="auto">
        <source src="/qa_center_startup_animation.mp4" type="video/mp4" />
      </video>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
